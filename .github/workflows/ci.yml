name: CI
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run test:smoke
      - run: npm run typecheck
      - run: npm run format:check
  supabase-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: mkdir -p tmp && npm run supabase:start > tmp/supabase-start.log 2>&1
      - run: npm run supabase:env
      - run: npm run test:cloud
      - if: always()
        run: npm run supabase:stop
